[tool.uv.workspace]
members = ["packages/*"]
# The relay is Go. It lives beside the Python packages because it is application
# code like they are, but uv wants a manifest from everything the glob matches.
exclude = ["packages/browser-relay"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "import-linter>=2.0",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# On for one rule only (PLC2701 below). Preview also WIDENS ruff's implicit
# default rule set, which is why the selection under [lint] is spelled out
# instead of extended — otherwise turning this on would quietly add ~70
# unrelated diagnostics.
preview = true

[tool.ruff.lint]
# ruff's stable default (E4/E7/E9/F) plus:
#   I       isort — sorted, grouped imports; make lint fails on drift
#   PLC0415 imports at the top of the file, never inside a function. A module's
#           dependencies should be readable in one place: an import buried in a
#           branch hides a layer crossing from review AND from import-linter,
#           which reads the module graph. It also turns an ImportError into a
#           runtime surprise on a path nobody exercised.
#   PLC2701 no importing another module's private names. A leading underscore
#           is the author saying "this can change without warning"; reaching for
#           it across a module boundary is how a refactor breaks a caller that
#           was never part of the contract.
select = ["E4", "E7", "E9", "F", "I", "PLC0415", "PLC2701"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals deliberately — a gating helper, the supervisor
# loop, a rendering table. That is white-box testing, not a leaked API. They also
# import inside a test body on purpose: the import is part of what is being
# asserted (that a module loads, that a fake stands in for it) and belongs next
# to the assertion, not in a header shared by fifty other tests.
"tests/*" = ["PLC0415", "PLC2701"]

[tool.ruff.lint.isort]
known-first-party = ["crucible", "impi", "ward", "wardline"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
include = [
    "packages/crucible/src", "packages/impi/src", "packages/ward/src",
    "packages/wardline/src", "tests",
]
extraPaths = [
    "packages/crucible/src", "packages/impi/src", "packages/ward/src",
    "packages/wardline/src",
]
venvPath = "."
venv = ".venv"

# Layer boundaries enforced mechanically (make lint). One change = one module;
# a contract breach fails the lint instead of surfacing at review. Two root
# packages: the reusable library `crucible` and the app `impi` built on it.
[tool.importlinter]
root_packages = ["crucible", "impi", "ward", "wardline"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The library never imports an application, or the tools they deploy"
type = "forbidden"
source_modules = ["crucible"]
forbidden_modules = ["impi", "ward", "wardline"]

# Both ways. The engine not being able to reach ward is the code saying what the
# deployment says: the credential, and the deciding that guards it, are not the
# engine's to hold — and cannot quietly become the engine's again.
[[tool.importlinter.contracts]]
name = "The two applications are strangers"
type = "independence"
modules = ["impi", "ward"]

[[tool.importlinter.contracts]]
name = "ward runs no agents: no runtime, no gateways, no flows"
type = "forbidden"
source_modules = ["ward"]
forbidden_modules = [
    "crucible.runtimes.pi",
    "crucible.flows",
    "crucible.tools",
    "crucible.profiles",
    "crucible.skills",
    "crucible.scheduler",
]

[[tool.importlinter.contracts]]
name = "Core is unaware of the chat platform libraries (adapters + main only)"
type = "forbidden"
source_modules = [
    "crucible.ports.agent",
    "crucible.ports.chat",
    "crucible.flows",
    "crucible.runtimes.pi",
    "crucible.profiles",
    "crucible.store",
    "crucible.config",
    "crucible.sessions_cli",
]
forbidden_modules = ["mattermostautodriver", "slack_bolt"]

[[tool.importlinter.contracts]]
name = "Gateway is unaware of pi/flows/store/profiles (chat ports only)"
type = "forbidden"
source_modules = ["crucible.gateways"]
forbidden_modules = [
    "crucible.runtimes.pi",
    "crucible.flows",
    "crucible.store",
    "crucible.profiles",
]

[[tool.importlinter.contracts]]
name = "The pi driver depends only on the agent ports"
type = "forbidden"
source_modules = ["crucible.runtimes.pi"]
forbidden_modules = [
    "crucible.ports.chat",
    "crucible.flows",
    "crucible.gateways",
    "crucible.store",
    "crucible.profiles",
]

[[tool.importlinter.contracts]]
name = "chat is a pure vocabulary, depends on nothing"
type = "forbidden"
source_modules = ["crucible.ports.chat"]
forbidden_modules = [
    "crucible.ports.agent",
    "crucible.runtimes.pi",
    "crucible.gateways",
    "crucible.flows",
    "crucible.store",
    "crucible.profiles",
]

[[tool.importlinter.contracts]]
name = "flows work only through ports (never concretes)"
type = "forbidden"
source_modules = ["crucible.flows"]
forbidden_modules = ["crucible.gateways", "crucible.runtimes.pi", "crucible.profiles"]

[[tool.importlinter.contracts]]
name = "The tool layer depends only on ports, not on platform/engine concretes"
type = "forbidden"
source_modules = ["crucible.tools", "crucible.builtin_tools"]
forbidden_modules = [
    "crucible.gateways",
    "crucible.runtimes.pi",
    "crucible.flows",
    "crucible.store",
    "crucible.profiles",
    "mattermostautodriver",
    "slack_bolt",
]

[[tool.importlinter.contracts]]
name = "interactions (widgets/forms + receiver): chat ports + store, not pi/flows/tools/platform"
type = "forbidden"
source_modules = ["crucible.interactions"]
forbidden_modules = [
    "crucible.gateways",
    "crucible.runtimes.pi",
    "crucible.flows",
    "crucible.tools",
    "crucible.profiles",
    "mattermostautodriver",
    "slack_bolt",
]

[[tool.importlinter.contracts]]
name = "Profile loading is runtime-agnostic (produces neutral AgentSpec, not a pi profile)"
type = "forbidden"
source_modules = ["crucible.profiles"]
forbidden_modules = ["crucible.runtimes.pi"]

[[tool.importlinter.contracts]]
name = "The scheduler works through ports and the store, never through concretes"
type = "forbidden"
source_modules = ["crucible.scheduler"]
forbidden_modules = [
    "crucible.gateways",
    "crucible.runtimes.pi",
    "crucible.flows",
    "crucible.profiles",
    "crucible.interactions",
    "mattermostautodriver",
    "slack_bolt",
]

[[tool.importlinter.contracts]]
name = "Attachment storage is a plain file store — no runtime, gateway or engine machinery"
type = "forbidden"
source_modules = ["crucible.attachments"]
forbidden_modules = [
    "crucible.runtimes.pi",
    "crucible.gateways",
    "crucible.flows",
    "crucible.tools",
    "crucible.interactions",
    "crucible.store",
    "crucible.profiles",
]

[[tool.importlinter.contracts]]
name = "Asking a human is a leaf primitive — it knows nobody"
type = "forbidden"
source_modules = ["crucible.approvals"]
forbidden_modules = [
    "crucible.runtimes.pi",
    "crucible.gateways",
    "crucible.flows",
    "crucible.tools",
    "crucible.interactions",
    "crucible.store",
    "crucible.profiles",
    "mattermostautodriver",
    "slack_bolt",
]

# The secret tool is nobody's dependency but its own. It ships in the agents'
# image so they can run it, and the broker imports its vocabulary — that is the
# whole of its coupling to anything here.
[[tool.importlinter.contracts]]
name = "The secret tool stands alone — it imports nothing else in the workspace"
type = "forbidden"
source_modules = ["wardline"]
forbidden_modules = ["crucible", "impi", "ward"]

# And only the vocabulary: `wire` is what both ends agreed on, while the two
# clients in that package are programs, not a library for the server to reuse.
[[tool.importlinter.contracts]]
name = "The broker uses the shared vocabulary, not the clients that speak it"
type = "forbidden"
source_modules = ["ward"]
forbidden_modules = ["wardline.exec_cli", "wardline.admin_cli", "wardline.console"]

# The deciding half lives in ward, and only its composition root is allowed to
# know which chat platform this deployment runs on — the broker asks through the
# ports, exactly as the engine does.
[[tool.importlinter.contracts]]
name = "The broker asks through the chat ports, never through a platform library"
type = "forbidden"
source_modules = [
    "ward.broker",
    "ward.ca",
    "ward.card",
    "ward.decisions",
    "ward.operations",
    "ward.policy",
    "ward.ports",
    "ward.server",
    "ward.store",
    "ward.vault",
]
forbidden_modules = ["crucible.gateways", "mattermostautodriver", "slack_bolt"]

[[tool.importlinter.contracts]]
name = "The skill library is a plain file store — no runtime, chat or engine machinery"
type = "forbidden"
source_modules = ["crucible.skills"]
forbidden_modules = [
    "crucible.runtimes.pi",
    "crucible.gateways",
    "crucible.flows",
    "crucible.tools",
    "crucible.interactions",
    "crucible.store",
    "crucible.profiles",
]
