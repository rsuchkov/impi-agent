# impi deployment — base file: the engine container only. The installer picks
# overlays on top (compose.mattermost.yaml to co-deploy Mattermost,
# compose.external-mm.yaml for an external server, compose.podman.yaml for
# rootless podman) and passes them as an explicit -f list with
# --env-file $IMPI_HOME/compose.env for the ${...} interpolation below.
#
# The impi service has NO env_file on purpose: the engine reads the bind-mounted
# /app/conf/.env itself (DOTENV_PATH), so secrets never enter the container
# environment and a plain `compose restart impi` picks up edits.

services:
  impi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        IMPI_UID: "${IMPI_UID:-1000}"
        IMPI_GID: "${IMPI_GID:-1000}"
    image: localhost/impi:local
    restart: unless-stopped
    # The container is what the agents run in, so it is built like a box, not
    # a workstation: a read-only root (every write the engine makes goes to a
    # volume or a bind mount; /tmp is memory), no capabilities (nothing here
    # binds below 1024 or changes uids), no privilege gain through a setuid
    # binary, and a ceiling on processes so a runaway shell cannot take the
    # host down with it. An image of your own that writes elsewhere gets a
    # tmpfs for it in a compose.d/ drop-in — see docs/installation.md.
    read_only: true
    tmpfs:
      # mode, not uid/gid: podman supports neither on a tmpfs (see
      # compose.browser.yaml); the only accounts here are root and the engine's.
      - /tmp:mode=1777,size=512m
      # The home directory is memory: the browser tool keeps its session under
      # ~/.cache, git its config, npm its cache. pi's own home inside it is the
      # bind mount below and persists; nothing else here needs to.
      - /home/impi:mode=1777,size=128m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    volumes:
      - ${IMPI_HOME:?set in compose.env}/conf:/app/conf:z
      - ${IMPI_AGENTS_DIR:?set in compose.env}:/app/agents:z
      # The shared skill library: its own directory (its own git repo, ideally),
      # so what you installed from someone else's repository is reviewable.
      - ${IMPI_SKILLS_DIR:-${IMPI_HOME}/skills}:/app/skills:z
      - impi-data:/app/data
      # pi's own home: the model credential (agent/auth.json), its settings.
      # A directory on the host rather than a named volume, so that an
      # agent's container can be handed the ONE file it needs out of it.
      - ${IMPI_HOME}/pi:/home/impi/.pi:z
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f impi.main || exit 1"]
      interval: 30s
      start_period: 20s

volumes:
  impi-data:
