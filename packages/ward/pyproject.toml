[project]
name = "ward"
version = "0.15.1"
description = "The secret broker: holds the credential, asks a human, hands the value to a process."
requires-python = ">=3.13"
# Deliberately thin. This is the container that holds the credential to the
# secret store, so what runs beside it is part of its threat model: no agent
# runtime, no `pi`, no gateway machinery it does not use.
dependencies = [
    "crucible",
    # The vocabulary its callers speak. Only `wardline.wire` is used here — the
    # two clients in that package are not this program's business, and a
    # contract in the root pyproject keeps it that way.
    "wardline",
    # The tiny CA: a server certificate for ward, a client certificate per agent.
    "cryptography>=43.0",
]

[project.scripts]
ward = "ward.cli:main"

[tool.uv.sources]
crucible = { workspace = true }
wardline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ward"]
