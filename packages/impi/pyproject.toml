[project]
name = "impi"
version = "0.15.4"
description = "Multi-agent Mattermost assistant built on crucible."
requires-python = ">=3.13"
dependencies = [
    "crucible",
]

[project.optional-dependencies]
# Passed through from crucible. The engine IMAGE installs this unconditionally
# (deploy/Dockerfile) so switching the inventory to MongoDB is a config change
# and not a rebuild; it stays an extra so a source install of the engine costs
# nothing for the deployments that stay on SQLite.
mongo = ["crucible[mongo]"]

[project.scripts]
impi = "impi.cli:main"

[tool.uv.sources]
crucible = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impi"]
