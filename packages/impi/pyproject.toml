[project]
name = "impi"
version = "0.6.0"
description = "Multi-agent Mattermost assistant built on crucible."
requires-python = ">=3.13"
dependencies = [
    "crucible",
]

[project.scripts]
impi = "impi.cli:main"

[tool.uv.sources]
crucible = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impi"]
