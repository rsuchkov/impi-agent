[project]
name = "crucible"
version = "0.15.4"
description = "Reusable agent runtime over the pi coding agent: gateways, tools, interactivity."
requires-python = ">=3.13"
dependencies = [
    "mattermostautodriver>=2.0",
    "slack-bolt>=1.20",
    "httpx>=0.27",
    "aiohttp>=3.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Scheduling. croniter owns cron-field semantics (lists, steps, the dom/dow
    # OR rule) — the class of detail a hand-rolled parser gets quietly wrong by
    # an hour or a day. tzdata ships the IANA database with the package, so a
    # named zone resolves the same in the slim container, in CI and in a venv.
    "croniter>=3.0",
    "tzdata>=2024.1",
    # Round-trip YAML: assigning a skill edits a profile a human wrote and keeps
    # its comments and layout, which a pyyaml dump would erase.
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# A second inventory backend, for a deployment that wants its state outside the
# pod. Optional because SQLite is the default and carries no dependency at all —
# installing this is a choice, not a tax on everyone. 4.9 is the floor because
# `AsyncMongoClient` arrives there; earlier releases have no async API in the
# package, and the engine is async throughout.
mongo = [
    "pymongo>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
